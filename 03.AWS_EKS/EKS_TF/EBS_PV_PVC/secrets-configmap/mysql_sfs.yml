apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalog-mysql
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/instance: catalog
    app.kubernetes.io/component: mysql
    app.kubernetes.io/owner: retail-store-sample
spec:
  replicas: 2
  serviceName: catalog-mysql
  # serviceName: catalog-mysql-rds

  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
      app.kubernetes.io/instance: catalog
      app.kubernetes.io/component: mysql
      app.kubernetes.io/owner: retail-store-sample

  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/instance: catalog
        app.kubernetes.io/component: mysql
        app.kubernetes.io/owner: retail-store-sample

    spec:
      containers:
        - name: mysql
          image: public.ecr.aws/docker/library/mysql:8.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: catalog-config
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: catalog-config
                  key: MYSQL_DATABASE

            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: catalog-config
                  key: MYSQL_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: catalog-config
                  key: MYSQL_PASSWORD

          volumeMounts:
            - name: data-ebs
              mountPath: /var/lib/mysql

  volumeClaimTemplates:
    - metadata:
        name: data-ebs
      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 10Gi

        storageClassName: ebs-sc
