apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalog-mysql
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/instance: catalog
    app.kubernetes.io/component: mysql
    app.kubernetes.io/owner: retail-store-sample
spec:
  replicas: 1
  serviceName: catalog-mysql
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
      app.kubernetes.io/instance: catalog
      app.kubernetes.io/component: mysql
      app.kubernetes.io/owner: retail-store-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/instance: catalog
        app.kubernetes.io/component: mysql
        app.kubernetes.io/owner: retail-store-sample
    spec:
      containers:
        - name: mysql
          image: "public.ecr.aws/docker/library/mysql:8.0"
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: my-secret-pw
            - name: MYSQL_DATABASE
              # value: catalogdb
              valueFrom:
                secretKeyRef:
                  key: RETAIL_CATALOG_PERSISTENCE_DB_NAME
                  name: mysecret-mysql
            - name: MYSQL_USER
              # value: catalog_user
              valueFrom:
                secretKeyRef:
                  key: RETAIL_CATALOG_PERSISTENCE_USER
                  name: mysecret-mysql
            - name: MYSQL_PASSWORD
              # value: kalyandb101
              valueFrom:
                secretKeyRef:
                  key: RETAIL_CATALOG_PERSISTENCE_PASSWORD
                  name: mysecret-mysql
            
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          emptyDir: {}