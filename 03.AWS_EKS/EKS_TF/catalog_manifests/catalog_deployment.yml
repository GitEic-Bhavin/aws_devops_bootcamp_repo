apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels:
    app.kubernetes.io/name: catalog
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: catalog
          securityContext:
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            # Adding ConfigMap as Env Here one by ones.
            # env:
            #   - name: RETAIL_CATALOG_PERSISTENCE_PROVIDER
            #     valueFrom:
            #       configMapKeyRef:
            #         name: myapp
            #         key: RETAIL_CATALOG_PERSISTENCE_PROVIDER

            # Adding whole configmap as all env will requires 

          envFrom:
            - configMapRef:
                name: myapp

          image: "public.ecr.aws/aws-containers/retail-store-sample-catalog:1.0.0"
          # image: "bhavin1099/retail-store-sample-app:2.0.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /topology
              port: 8080
          livenessProbe:
            httpGet:
              path: /topology
              port: 8080                 
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 256Mi
