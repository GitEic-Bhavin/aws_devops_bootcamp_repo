events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Wrap the regex string in quotes so Nginx doesn't confuse {3} with a config block
    map $msec $time_ms {
        "~^(\d+)\.(\d{3})$" $1$2;
        default 0;
    }

    # EMF JSON log template with millisecond timestamp
    log_format emf_json escape=json
      '{"_aws":{"Timestamp":$time_ms,"CloudWatchMetrics":[{"Namespace":"Nginx/EMFMetrics","Dimensions":[["ServiceName","Status"]],"Metrics":[{"Name":"RequestCount","Unit":"Count"}]}]},"ServiceName":"NginxService","Status":"$status","RequestCount":1}';

    server {
        listen 80;

        access_log /dev/stdout emf_json;
        error_log  /dev/stderr;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }
    }
}